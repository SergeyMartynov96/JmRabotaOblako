name: LifeMart Telegram 09:00 timer
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, arm_morning]
        default: verify
      parent_run:
        description: Existing 08:00 parent run ID; arm_morning only
        default: ''
permissions:
  contents: read
  actions: write
concurrency:
  group: lifemart-telegram-morning-timer
  cancel-in-progress: false
jobs:
  timer:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify dispatch without reports
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'arm_morning'
        run: python3 -m telegram_reports.timer --verify
      - name: Prepare from 08:30 for delivery from 09:00
        if: github.event_name == 'workflow_run'
        run: python3 -m telegram_reports.timer
      - name: Restore today's morning timer from verified parent
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'arm_morning'
        env:
          PARENT_RUN: ${{ inputs.parent_run }}
        run: python3 -m telegram_reports.timer --arm-morning
