name: LifeMart daily cycle recovery relay
on:
  workflow_run:
    workflows: [LifeMart daily metrics, LifeMart AV12 facts, LifeMart K44 daily facts, LifeMart X76 daily facts, LifeMart three daily cycles]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, dispatch]
        default: verify
      parent_run:
        description: Existing same-day external timer or completed morning run
        required: true
permissions:
  contents: read
  actions: write
concurrency:
  group: lifemart-cycle-recovery-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m unittest discover -s tests -q
      - name: Recover common stage from verified source
        env:
          PARENT_RUN: ${{ inputs.parent_run }}
          VERIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'verify' }}
        run: |
          if [ "$VERIFY" = true ]; then
            python3 -m daily_cycle.relay --verify
          else
            python3 -m daily_cycle.relay
          fi
      - name: Preserve recovery notice acknowledgement
        if: always() && hashFiles('cycle-receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycle-recovery-notice-${{ github.run_id }}
          path: cycle-receipt.json
          retention-days: 14
