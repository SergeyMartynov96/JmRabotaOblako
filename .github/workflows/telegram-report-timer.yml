name: LifeMart Telegram 09:00 timer
on:
  workflow_run:
    workflows: [LifeMart daily metrics]
    types: [requested]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: lifemart-telegram-morning-timer
  cancel-in-progress: false
jobs:
  timer:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify dispatch without reports
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m telegram_reports.timer --verify
      - name: Wait for 09:00 from existing external morning signal
        if: github.event_name == 'workflow_run'
        run: python3 -m telegram_reports.timer
