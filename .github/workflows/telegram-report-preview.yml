name: Telegram native report preview
on:
  workflow_dispatch:
    inputs:
      review_public_key:
        description: Base64 public key for encrypted private review
        type: string
        required: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LIFEMART_LOGIN: ${{ secrets.LIFEMART_LOGIN }}
      LIFEMART_PASSWORD: ${{ secrets.LIFEMART_PASSWORD }}
      REVIEW_PUBLIC_KEY: ${{ inputs.review_public_key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.62.0 cryptography==50.0.0 Pillow==13.0.0 pypdfium2==5.14.0
      - run: python3 -m telegram_reports.preview
      - name: Upload encrypted visual proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-report-review
          path: review.enc.json
          retention-days: 1
          if-no-files-found: error
