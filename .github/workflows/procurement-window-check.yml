name: Read-only procurement date window check
on:
  workflow_dispatch:
    inputs:
      when:
        type: choice
        options: [tomorrow, today]
        default: tomorrow
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.62.0
      - name: Check procurement cells without writes or BI requests
        env:
          CHECK_WHEN: ${{ inputs.when || 'tomorrow' }}
        run: python3 -m daily_metrics.procurement_probe --when "$CHECK_WHEN"
