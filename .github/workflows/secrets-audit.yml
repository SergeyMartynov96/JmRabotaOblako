name: LifeMart secret configuration audit
run-name: LifeMart secrets configuration audit (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIFEMART_LOGIN: ${{ secrets.LIFEMART_LOGIN }}
      LIFEMART_PASSWORD: ${{ secrets.LIFEMART_PASSWORD }}
      CRONITOR_TELEMETRY_KEY: ${{ secrets.CRONITOR_TELEMETRY_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check configured names and read-only SU login
        run: |
          python3 - <<'PY'
          import json, os, sys
          names=('LIFEMART_LOGIN','LIFEMART_PASSWORD','CRONITOR_TELEMETRY_KEY')
          result={'configured':{name:bool(os.getenv(name)) for name in names},'su_login':'not_attempted','metrics_login':'not_attempted'}
          if all(result['configured'][name] for name in names[:2]):
              sys.path.insert(0,'scripts')
              import cloud_readonly_test as ro
              try:
                  ro.ReadOnlySU().login()
                  result['su_login']='verified_from_secrets'
              except Exception as exc:
                  result['su_login']='failed_'+type(exc).__name__
              from daily_metrics.io import SUReports
              try:
                  SUReports().login()
                  result['metrics_login']='verified_from_secrets'
              except Exception as exc:
                  result['metrics_login']='failed_'+type(exc).__name__
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'w') as out:
              out.write('Secret configuration (values are never displayed)\n\n'+json.dumps(result,indent=2))
          if result['su_login']!='verified_from_secrets' or result['metrics_login']!='verified_from_secrets':
              raise SystemExit(1)
          PY
