name: Prevent plaintext secrets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      LIFEMART_LOGIN: ${{ secrets.LIFEMART_LOGIN }}
      LIFEMART_PASSWORD: ${{ secrets.LIFEMART_PASSWORD }}
      CRONITOR_TELEMETRY_KEY: ${{ secrets.CRONITOR_TELEMETRY_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check tracked files without printing secret values
        run: python3 scripts/check_no_secrets.py
      - name: Verify credentials are read only from Secrets
        run: python3 -m unittest discover -s tests -p test_secret_storage.py -v
