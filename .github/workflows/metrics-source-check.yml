name: LifeMart additional sources check
on:
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [bi, invoices, cells, reasons]
        default: bi
      branch:
        type: choice
        options: [all, АВ12, М42, Г34]
        default: all
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIFEMART_LOGIN: ${{ secrets.LIFEMART_LOGIN }}
      LIFEMART_PASSWORD: ${{ secrets.LIFEMART_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install browser API
        run: python3 -m pip install playwright==1.62.0
      - name: Inspect permitted report schemas without writes
        env:
          SOURCE: ${{ inputs.source || 'bi' }}
          BRANCH: ${{ inputs.branch || 'all' }}
        run: python3 -m daily_metrics.source_probe --source "$SOURCE" --branch "$BRANCH"
